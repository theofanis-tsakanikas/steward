name: destroy

# Removes the estate in reverse dependency order, then sweeps: the run is red if anything is left. A deploy
# path with no exercised destroy path is how an estate gets left standing.
#
# workflow_dispatch only, and only with the confirmation phrase typed. The bootstrap layer is not touched: it is
# removed by deleting the project (docs/DAY-ONE.md step 10).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type destroy-steward to confirm"
        required: true
        type: string
      publish_version:
        description: "The publish_version the estate was deployed with (governance reads that parameter version at plan time, destroy included)"
        required: true
        default: "v1"
        type: string

permissions:
  contents: read

# Its own group: GitHub keeps only one pending run per group, so a destroy that shared the deploy's group could be
# silently replaced by a newer deploy. Terraform's state lock is what serialises two runs that do overlap.
concurrency:
  group: steward-destroy
  cancel-in-progress: false

env:
  UV_PYTHON: "3.12"
  TF_IN_AUTOMATION: "1"

jobs:
  destroy:
    if: ${{ inputs.confirm == 'destroy-steward' }}
    runs-on: ubuntu-latest
    environment: destroy
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      STATE_BUCKET: ${{ vars.GCP_PROJECT_ID }}-steward-tfstate
      PUBLISH_VERSION: ${{ inputs.publish_version }}
    steps:
      # Inputs reach a shell only through env, and only after they are checked: the identity below is strong.
      - name: check the inputs
        run: |
          [[ "$PUBLISH_VERSION" =~ ^v[0-9]+$ ]] || { echo "publish_version must look like v1"; exit 1; }
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
      - run: uv sync --group dev
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DESTROYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      # Every layer is attempted even if an earlier one failed (`if: always()`): one failure must not strand the rest,
      # and the run is red if any step failed. expires_at is a placeholder: destroy reads state, not that value.
      - name: marketplace
        if: ${{ always() }}
        working-directory: infra/marketplace
        run: |
          uv run python ../../scripts/tfvars.py --project "$PROJECT" --layer marketplace > grantees.auto.tfvars.json
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=marketplace"
          terraform destroy -input=false -auto-approve -var "project_id=$PROJECT" -var "expires_at=2000-01-01"

      - name: assurance
        if: ${{ always() }}
        working-directory: infra/assurance
        run: |
          uv run python ../../scripts/tfvars.py --project "$PROJECT" --layer assurance > principals.auto.tfvars.json
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=assurance"
          terraform destroy -input=false -auto-approve -var "project_id=$PROJECT" -var "expires_at=2000-01-01"

      - name: governance
        if: ${{ always() }}
        working-directory: infra/governance
        run: |
          uv run python ../../scripts/tfvars.py --project "$PROJECT" --layer governance > principals.auto.tfvars.json
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=governance"
          terraform destroy -input=false -auto-approve \
            -var "project_id=$PROJECT" -var "expires_at=2000-01-01" -var "estate_version=$PUBLISH_VERSION"

      - name: estate
        if: ${{ always() }}
        working-directory: infra/estate
        run: |
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="prefix=estate"
          terraform destroy -input=false -auto-approve \
            -var "project_id=$PROJECT" -var "expires_at=2000-01-01" -var "publish_version=$PUBLISH_VERSION"

      - name: sweep (red if anything is left)
        if: ${{ always() }}
        run: uv run python scripts/sweep.py --project "$PROJECT"

# BigQuery dataset `finance`: invoices. Retention is driven by tax law, not by GDPR alone.
dataset: finance
version: 3
description: Invoices of Halverra Telecom (fictional).
owner: group:finance-owners@halverra.example
steward: group:finance-stewards@halverra.example
custodian: group:data-platform@halverra.example
lawful_basis: "GDPR Art. 6(1)(c) — legal obligation (tax and accounting records)"
retention:
  period_days: 3650
  legal_basis: "Tax and accounting record-keeping obligation, 10 years (illustrative; varies by country)"
# Roles with standing read access. Every other role reaches this dataset only through an approved,
# expiring marketplace grant (claim 6) — and a role in neither list never does.
readers: [steward, bi_service]
marketplace:
  listable: false
  approvers: group:finance-owners@halverra.example
  max_grant_days: 7
  grantable_roles: []   # not listed: finance is never requested through the marketplace
changelog:
  - {version: 1, date: "2026-10-01", change: "first contract"}
  - {version: 2, date: "2026-10-01", change: "declare standing readers; marketplace grants only roles that are not readers; drop masking for fraud_investigator, who never reads finance"}
  - {version: 3, date: "2026-10-01", change: "not listed, so nothing is grantable: finance is reached by standing readers only"}

tables:
  billing:
    description: One row per invoice. Partitioned by issue_date.
    primary_key: [invoice_id]
    retention: {mode: partition, column: issue_date}
    row_access: {column: country}
    columns:
      invoice_id:
        {type: STRING, classification: internal, description: "Invoice number.",
         quality: [{id: Q-FIN-001, kind: completeness}, {id: Q-FIN-002, kind: uniqueness}]}
      customer_id:
        {type: STRING, classification: personal, kinds: [customer_key], description: "The invoiced customer.",
         masking: {analyst: hash, steward: hash, bi_service: hash},
         quality: [{id: Q-FIN-003, kind: referential, references: crm.customers.customer_id}]}
      iban:
        {type: STRING, classification: personal, kinds: [iban], description: "Direct-debit bank account.",
         masking: {analyst: last_four, steward: last_four, bi_service: nullify}}
      amount:
        {type: NUMERIC, classification: internal, description: "Invoice amount, EUR.",
         quality: [{id: Q-FIN-004, kind: validity, min: 0}]}
      currency:
        {type: STRING, classification: internal, description: "ISO 4217 currency code.",
         quality: [{id: Q-FIN-005, kind: validity, allowed: [EUR]}]}
      issue_date: {type: DATE, classification: internal, description: "Issue date (partition column)."}
      due_date: {type: DATE, classification: internal, description: "Payment due date."}
      status:
        {type: STRING, classification: internal, description: "paid | open | overdue.",
         quality: [{id: Q-FIN-006, kind: validity, allowed: [paid, open, overdue]}]}
      country: {type: STRING, classification: internal, description: "Country of the customer."}

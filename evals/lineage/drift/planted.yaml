    {version: 2, date: "2026-09-30", change: "callback reconciliation dashboard for the CRM team",
     requested_by: "user:katerina.vasileiou@halverra.example", approved_by: "user:dimitris.nikolaou@halverra.example",
     ceilings_added: [{role: bi_service, kinds: [msisdn]}]}
